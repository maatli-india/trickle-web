<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbfaf7" />
    <title>You're offline · Trickle</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: #f6f2eb;
        color: #1b1d1c;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        position: relative;
        width: 100%;
        max-width: 384px;
        overflow: hidden;
        border: 1px solid #ded8ce;
        border-radius: 24px;
        background: #fff;
        padding: 24px;
        box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.08);
      }
      .accent { position: absolute; inset: 0 0 auto 0; height: 4px; background: #e7b65c; }
      .icon { width: 52px; height: 52px; border-radius: 14px; display: block; margin-bottom: 16px; }
      .eyebrow { margin: 0; font-size: 10px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: #e85b43; }
      h1 { margin: 8px 0 0; font-size: 24px; line-height: 1.25; font-weight: 600; color: #183b3a; }
      p.message { margin: 10px 0 0; font-size: 14px; line-height: 1.6; color: #62645f; }
      button {
        margin-top: 24px;
        width: 100%;
        border: 0;
        border-radius: 12px;
        padding: 12px;
        background: #183b3a;
        color: #fff;
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { background: #285c59; }
    </style>
  </head>
  <body>
    <main class="card" role="alert">
      <span class="accent" aria-hidden="true"></span>
      <img class="icon" src="/icon-192.png" alt="" width="52" height="52" />
      <p class="eyebrow">Trickle</p>
      <h1>You're offline</h1>
      <p class="message">Check your internet connection and try again. Your requests and trips are safe — nothing is lost while you're offline.</p>
      <button type="button" id="retry">Try again</button>
    </main>
    <script src="/offline.js"></script>
  </body>
</html>
